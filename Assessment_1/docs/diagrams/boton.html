  <script>
    const canvas = document.getElementById('canvas');
    const output = document.getElementById('zoom');
    let zoom = 1;
    function setZoom(value) {
      zoom = Math.max(0.5, Math.min(2.5, value));
      canvas.style.width = `${zoom * 100}%`;
      output.value = `${Math.round(zoom * 100)} %`;
    }
    document.getElementById('zoom-out').addEventListener('click', () => setZoom(zoom - 0.15));
    document.getElementById('zoom-in').addEventListener('click', () => setZoom(zoom + 0.15));
    document.getElementById('fit').addEventListener('click', () => setZoom(1));
  </script>
