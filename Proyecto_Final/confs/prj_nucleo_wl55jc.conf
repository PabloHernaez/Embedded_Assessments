# Solo lo que cambia respecto a Zephyr y al defconfig de la placa
# (que ya activa SERIAL, GPIO, ARM_MPU y HW_STACK_PROTECTION).

# LPUART1 (VCP) queda reservado para los reportes: la placa trae consola y
# printk; se quitan. build_checks.c impide compilar si vuelven, o si se
# activan logs, shell o banner.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n

# UART por interrupciones: RX del GPS y TX de reportes sin espera activa.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# PM sigue desactivado (valor por defecto): los modos STOP pararian SysTick y
# la RX del GPS. En reposo el hilo idle ya ejecuta WFI.

# snprintf con coma flotante para los reportes (picolibc IO_FLOAT).
CONFIG_REQUIRES_FLOAT_PRINTF=y

# I2C (MPU6050 + Si7021) con recuperacion de bus. Una transferencia normal dura
# < 2 ms a 100 kHz; con el bus retenido se aborta a los 10 ms y no a los 500.
CONFIG_I2C=y
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_I2C_STM32_TRANSFER_TIMEOUT_MSEC=10
# ADC del LDR.
CONFIG_ADC=y
# B1 por el subsistema input (gpio-keys con antirrebote); callbacks sin hilo propio.
CONFIG_INPUT=y
CONFIG_INPUT_MODE_SYNCHRONOUS=y
# CRC-8 del Si7021 y causa de reinicio.
CONFIG_CRC=y
CONFIG_HWINFO=y
# Watchdog por hilo (task_wdt) respaldado por el IWDG: 1 s + 1 s = 2 s.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=3
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# Hilo main: prioridad 4 (adquisicion 3, GPS 5). Pila de 3 KB: snprintf con
# coma flotante usa ~1,4 KB (medido en qemu_cortex_m3, sin FPU como el WL55).
CONFIG_MAIN_THREAD_PRIORITY=4
CONFIG_MAIN_STACK_SIZE=3072
