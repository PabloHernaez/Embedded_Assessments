# LPUART1 (VCP) queda reservado para los reportes: sin consola, printk ni logs.
# build_checks.c impide compilar produccion si alguno se activa.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
CONFIG_LOG=n

# UART por interrupciones: RX del GPS y TX de reportes sin espera activa.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Reloj del kernel: 10000 ticks/s, tickless y timeouts de 64 bits.
CONFIG_CORTEX_M_SYSTICK=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_TIMEOUT_64BIT=y
# Sin modos STOP: SysTick y la RX del GPS dejarian de funcionar.
# En reposo el hilo idle ya ejecuta WFI.
CONFIG_PM=n

# snprintf con coma flotante para los reportes (picolibc IO_FLOAT).
CONFIG_REQUIRES_FLOAT_PRINTF=y

# Perifericos: I2C (MPU6050 + Si7021), ADC (LDR), GPIO (B1 + RGB).
CONFIG_I2C=y
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_ADC=y
CONFIG_GPIO=y
# CRC-8 del Si7021 y causa de reinicio.
CONFIG_CRC=y
CONFIG_HWINFO=y
# Watchdog por hilo (task_wdt) respaldado por el IWDG: 1 s + 1 s = 2 s.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=3
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# Proteccion de pila y prioridad del hilo main (adquisicion 3, main 4, GPS 5).
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MAIN_THREAD_PRIORITY=4
# snprintf con coma flotante: en qemu_cortex_m3 el formato usa ~1,4 KB de pila de main.
CONFIG_MAIN_STACK_SIZE=3072
