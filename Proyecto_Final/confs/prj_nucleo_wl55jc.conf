# Salida: el puerto serie queda reservado para la aplicacion
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_SHELL=n
CONFIG_LOG=n

# UART: interrupciones y configuracion desde la aplicacion
# Configuración para recepción del GPS y transmisión usando interrupciones
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# Reloj del kernel y tiempos
# Uso de temporización para adquisición, reportes y estadística
CONFIG_TIMEOUT_64BIT=y
CONFIG_PM=n
CONFIG_CORTEX_M_SYSTICK=y
# No obligamos a hacer las 10000 interrupciones por segundo
CONFIG_TICKLESS_KERNEL=y
# 10000 ticks equivalen a un segundo
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# Bus de sensores
# Comunicación con MPU6050, Si7021
CONFIG_I2C=y
CONFIG_I2C_STM32_TRANSFER_TIMEOUT_MSEC=5
CONFIG_I2C_STM32_BUS_RECOVERY=y
CONFIG_CRC=y

# Conversion analogica y soporte de diagnostico
# Protección de bloqueos y causas de reinicio
# Configuracion de lectura de KY-018 LDR
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# Proteccion de pila y configuracion del hilo main
# Inicio del Main
CONFIG_ARM_MPU=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_MAIN_THREAD_PRIORITY=4
CONFIG_MAIN_STACK_SIZE=2048
